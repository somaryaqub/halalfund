<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Alegreya Sans','Helvetica Neue',Arial,sans-serif">
  <style>
    .eyebrow{font-weight:700;letter-spacing:.16em;fill:#E5A05B;font-size:20px;}
    .head{font-family:'Alegreya',Georgia,serif;font-weight:800;fill:#F4F1E6;font-size:44px;}
    .rowlab{fill:#F4F1E6;font-weight:700;font-size:23px;}
    .rowlabdim{fill:#9DBBAA;font-weight:700;font-size:23px;}
    .barval{font-family:'Alegreya',Georgia,serif;font-weight:800;font-size:30px;}
    .axis{fill:#9DBBAA;font-size:18px;}
    .note{font-family:'Alegreya',Georgia,serif;font-style:italic;fill:#E5A05B;font-size:25px;}
    .src{fill:#9DBBAA;font-size:17px;}
  </style>
  <rect width="1280" height="720" fill="#1E5540"/>
  <text class="eyebrow" x="80" y="98">THE NEED · WAIT TIMES</text>
  <text class="head" x="80" y="162">The larger the family, the longer the wait.</text>

  <!-- gridlines 0..5 across x=460..1120 (132px/yr) -->
  <g stroke="#F4F1E6" stroke-opacity="0.10" stroke-width="1">
    <line x1="460" y1="300" x2="460" y2="500"/>
    <line x1="592" y1="300" x2="592" y2="500"/>
    <line x1="724" y1="300" x2="724" y2="500"/>
    <line x1="856" y1="300" x2="856" y2="500"/>
    <line x1="988" y1="300" x2="988" y2="500"/>
    <line x1="1120" y1="300" x2="1120" y2="500"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="460" y="536">0</text>
    <text x="592" y="536">1</text>
    <text x="724" y="536">2</text>
    <text x="856" y="536">3</text>
    <text x="988" y="536">4</text>
    <text x="1120" y="536">5</text>
    <text x="790" y="566" font-size="17" letter-spacing=".06em">YEARS ON THE WAITLIST</text>
  </g>

  <!-- Row 1: single adult -->
  <text class="rowlabdim" x="440" y="360" text-anchor="end">Single adult · 1-bedroom</text>
  <rect x="460" y="332" width="198" height="42" rx="3" fill="#9DBBAA" fill-opacity="0.55"/>
  <text class="barval" x="678" y="362" fill="#9DBBAA">1 to 2 years</text>

  <!-- Row 2: large family -->
  <text class="rowlab" x="440" y="470" text-anchor="end">Family · 4+ bedrooms</text>
  <rect x="460" y="442" width="528" height="42" rx="3" fill="#E5A05B"/>
  <text class="barval" x="972" y="472" text-anchor="end" fill="#143526">4 years and longer</text>

  <text class="note" x="460" y="524">the longest wait of anyone in the system</text>

  <text class="src" x="80" y="688">Source: Civida wait times by unit size; City of Edmonton Housing Needs Assessment.</text>
</svg>
